<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Challenge | CommunityVerse Games</title>
    <meta
      name="description"
      content="Restaurant Challenge is the CommunityVerse browser game where you choose a restaurant, play quick trivia rounds, collect customers, and climb a shared leaderboard."
    />
    <link rel="canonical" href="https://communityversegames.com/restaurant" />
    <meta property="og:title" content="Restaurant Challenge | CommunityVerse Games" />
    <meta
      property="og:description"
      content="Choose a restaurant, jump into fast trivia rounds, win customers, and climb a shared leaderboard that updates across devices."
    />
    <meta property="og:url" content="https://communityversegames.com/restaurant" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("hub") === "1" || params.get("view") === "hub") {
          document.documentElement.classList.add("restaurant-hub-mode");
        }
      })();
    </script>
    <link rel="stylesheet" href="../shared/restaurant.css" />
    <script defer src="../shared/app-core.js?v=asset-path-fix"></script>
    <script defer src="hub.js?v=f7b048e-safe-summary"></script>
  </head>
  <body data-page="hub">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <a class="brand" href="../index.html">CommunityVerse Games</a>
        </div>
      </header>

      <section class="panel challenge-splash">
        <div class="challenge-splash-grid">
          <div class="challenge-splash-copy">
            <p class="kicker">Restaurant Challenge</p>
            <h1 class="page-title challenge-splash-title">Choose a restaurant to play.</h1>
            <p class="challenge-splash-lead">
              Pick a restaurant, answer fast trivia rounds, win your first customer, and keep your progress moving from device to device.
            </p>
            <div class="challenge-splash-picker" id="splash-chooser">
              <label class="field challenge-splash-field" for="splash-restaurant-select">
                <span class="field-label">Choose a restaurant to play</span>
                <select class="select" id="splash-restaurant-select" aria-label="Choose a restaurant to play">
                  <option value="americana">Americana Diner</option>
                  <option value="placeholder-1" disabled>Placeholder 1</option>
                  <option value="placeholder-2" disabled>Placeholder 2</option>
                </select>
              </label>
            </div>
            <div class="challenge-splash-actions">
              <a class="button button-primary" id="splash-play-button" href="/americana/">Play Selected Restaurant</a>
              <a class="button" id="splash-my-restaurant-button" href="/restaurant/?hub=1#hero-panel">View My Restaurant</a>
              <a class="button button-muted" id="splash-leaderboard-button" href="/restaurant/?hub=1#leaderboard-panel">See The Leaderboard</a>
            </div>
          </div>
        </div>
      </section>

      <section class="panel hero" id="hero-panel"></section>

      <section class="grid-two">
        <div class="grid-stack">
          <section class="panel panel-pad" id="collection-panel"></section>
        </div>

        <div class="grid-stack">
          <section class="panel panel-pad" id="leaderboard-panel"></section>
        </div>
      </section>

    </main>
  </body>
</html>
