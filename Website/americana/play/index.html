<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Americana Diner Game | CommunityVerse Games</title>
    <meta
      name="description"
      content="Play The Americana Diner Game, answer 10 questions, unlock a character, and progress on the leaderboard."
    />
    <link rel="canonical" href="https://communityversegames.com/americana/play" />
    <meta property="og:title" content="The Americana Diner Game | CommunityVerse Games" />
    <meta
      property="og:description"
      content="Play a quick game of trivia, unlock a character, and progress on the leaderboard."
    />
    <meta property="og:url" content="https://communityversegames.com/americana/play" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/shared/restaurant.css?v=multiplayer-mobile-v1" />
    <script defer src="/shared/app-core.js?v=series-v1"></script>
    <script defer src="/americana/play-launch.js?v=series-v1"></script>
  </head>
  <body data-page="americana-play" data-build="americana-play-2">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <a class="brand" href="/americana/">CommunityVerse Games</a>
        </div>
        <div class="topbar-actions">
          <span class="sales-demo-cta-note hidden" data-sales-demo-cta-note></span>
          <a class="topbar-contact topbar-sales-cta hidden" href="/get-your-own-game/" data-sales-demo-cta>Get Your Own Game</a>
        </div>
      </header>

      <section class="panel hero hidden" id="hero-panel"></section>

      <section class="panel panel-pad opening-start-panel" id="start-panel">
        <div class="opening-start-shell">
          <div class="opening-start-heading">
            <p class="kicker" style="margin: 0 0 4px;">Restaurant Challenge Trivia</p>
            <h2 class="opening-title">Loading game...</h2>
            <p class="copy opening-title-copy">Getting your trivia round ready.</p>
          </div>
        </div>
      </section>

      <section class="panel panel-pad hidden opening-session-panel" id="game-panel"></section>
      <section class="panel panel-pad hidden opening-session-panel" id="result-panel"></section>
    </main>
    <script defer src="/_vercel/insights/script.js"></script>
