<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Americana Diner Game | CommunityVerse Games</title>
    <meta
      name="description"
      content="Play The Americana Diner Game, answer 10 questions, win a customer, and progress on the leaderboard."
    />
    <link rel="canonical" href="https://communityversegames.com/americana/play" />
    <meta property="og:title" content="The Americana Diner Game | CommunityVerse Games" />
    <meta
      property="og:description"
      content="Play a quick game of trivia, win a customer, and progress on the leaderboard."
    />
    <meta property="og:url" content="https://communityversegames.com/americana/play" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/shared/restaurant.css" />
    <script defer src="/shared/restaurant-core.js?v=36d78de-active-profile"></script>
    <script defer src="/americana/game.js?v=americana-play-2"></script>
  </head>
  <body data-page="americana-play" data-build="americana-play-2">
    <main class="app-shell">
      <header class="topbar">
        <div>
          <a class="brand" href="/americana/">CommunityVerse Games</a>
        </div>
      </header>

      <section class="panel hero hidden" id="hero-panel"></section>

      <section class="panel panel-pad opening-start-panel" id="start-panel">
        <div class="opening-start-shell">
          <div class="opening-start-heading">
            <p class="kicker" style="margin: 0 0 4px;">Restaurant Challenge</p>
            <h2 class="opening-title">Starting the game...</h2>
            <p class="copy opening-title-copy">If nothing happens for a moment, refresh once.</p>
          </div>

          <div class="opening-start-grid">
            <div class="opening-start-hero">
              <img
                class="hero-banner-image hero-banner-image-start"
                src="/assets/restaurant-challenge/restaurants/americana/americana-diner-hero.jpg"
                alt="Americana Diner hero artwork"
              />
            </div>

            <div class="opening-start-side opening-start-side-wide">
              <div class="opening-guest-stack">
                <div class="opening-guest-grid">
                  <article class="opening-guest-card">
                    <img class="opening-guest-photo" src="/assets/restaurant-challenge/customers/curtis-coolwater.jpg" alt="Curtis Coolwater" />
                    <div class="opening-guest-copy">
                      <p class="opening-guest-name">Curtis Coolwater</p>
                    </div>
                  </article>
                  <article class="opening-guest-card">
                    <img class="opening-guest-photo" src="/assets/restaurant-challenge/customers/pastor-caleb-brooks.jpg" alt="Pastor Caleb Brooks" />
                    <div class="opening-guest-copy">
                      <p class="opening-guest-name">Pastor Caleb Brooks</p>
                    </div>
                  </article>
                  <article class="opening-guest-card">
                    <img class="opening-guest-photo" src="/assets/restaurant-challenge/customers/ming-wu.jpg" alt="Ming Wu" />
                    <div class="opening-guest-copy">
                      <p class="opening-guest-name">Ming Wu</p>
                    </div>
                  </article>
                </div>
              </div>
            </div>
          </div>

          <p class="opening-title-small opening-title-small-bottom">Can You Earn A New Regular Customer?</p>

          <div class="button-row opening-start-actions opening-start-actions-bottom">
            <a class="button button-muted" href="/americana/">Back to Americana</a>
            <a class="button button-muted" href="/restaurant/?hub=1">Back to Hub</a>
          </div>
        </div>
      </section>

      <section class="panel panel-pad hidden opening-session-panel" id="game-panel"></section>
      <section class="panel panel-pad hidden opening-session-panel" id="result-panel"></section>
    </main>
  </body>
</html>
