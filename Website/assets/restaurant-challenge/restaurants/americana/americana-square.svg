<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Americana Diner square placeholder</title>
  <desc id="desc">A square retro diner sign used as a stand-in image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F0E2"/>
      <stop offset="1" stop-color="#F0E2C9"/>
    </linearGradient>
    <linearGradient id="card" x1="120" y1="100" x2="680" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F4E44"/>
      <stop offset="1" stop-color="#17362F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="80" fill="url(#bg)"/>
  <circle cx="640" cy="160" r="130" fill="#D58A2B" fill-opacity="0.16"/>
  <circle cx="170" cy="650" r="150" fill="#C54C38" fill-opacity="0.15"/>
  <rect x="110" y="110" width="580" height="580" rx="44" fill="url(#card)"/>
  <rect x="150" y="150" width="500" height="500" rx="30" fill="#FFFDF8" fill-opacity="0.08" stroke="#FFFDF8" stroke-opacity="0.4" stroke-width="3"/>
  <text x="400" y="315" text-anchor="middle" fill="#FFFDF8" font-family="Georgia, serif" font-size="54" font-weight="700">AMERICANA</text>
  <text x="400" y="385" text-anchor="middle" fill="#F2C06B" font-family="Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="6">DINER</text>
  <path d="M240 470H560" stroke="#FFFDF8" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 28"/>
  <text x="400" y="540" text-anchor="middle" fill="#FFFDF8" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">PLACEHOLDER</text>
  <text x="400" y="575" text-anchor="middle" fill="#FFFDF8" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5">FOR CUSTOMER CARDS</text>
</svg>
