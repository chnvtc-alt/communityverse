<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Card Preview</title>
    <style>
      :root {
        --bg: #f4efe3;
        --panel: rgba(255, 250, 240, 0.92);
        --panel-strong: #fff8ea;
        --ink: #1e2a22;
        --muted: #5a6c62;
        --line: rgba(38, 58, 45, 0.14);
        --accent: #ba6c1d;
        --green: #2f6f52;
        --shadow: 0 24px 80px rgba(36, 37, 27, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(255, 213, 128, 0.6), transparent 25%),
          radial-gradient(circle at bottom right, rgba(81, 147, 110, 0.32), transparent 25%),
          linear-gradient(180deg, #f7f3ea 0%, #efe5cf 100%);
      }

      .page {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 20px 40px;
      }

      .site-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding: 16px 20px;
        background: rgba(255, 250, 240, 0.88);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      .site-brand {
        color: var(--green);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.84rem;
      }

      .site-links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .site-links a {
        text-decoration: none;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 700;
      }

      .hero {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 22px 24px;
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--green);
        font-weight: 700;
      }

      .hero h1 {
        margin: 0 0 8px;
        font-family: "Fraunces", serif;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .card-preview {
        display: grid;
        grid-template-columns: minmax(220px, 320px) 1fr;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .card-image {
        min-height: 100%;
        background: linear-gradient(180deg, rgba(47, 111, 82, 0.1), rgba(186, 108, 29, 0.1));
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-image.placeholder {
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-weight: 700;
      }

      .card-body {
        padding: 22px 24px;
      }

      .card-body h2 {
        margin: 0 0 10px;
        font-family: "Fraunces", serif;
        font-size: clamp(1.8rem, 4vw, 2.7rem);
        letter-spacing: -0.03em;
      }

      .card-body p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 1rem;
      }

      .stat-pills, .tag-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .stat-pills { margin-bottom: 14px; }
      .tag-pills { margin-top: 16px; }

      .pill {
        border: 1px solid var(--line);
        background: white;
        border-radius: 999px;
        padding: 10px 14px;
        font-weight: 700;
      }

      .detail {
        margin-top: 10px;
        font-size: 1.05rem;
      }

      .detail strong {
        color: var(--ink);
      }

      .empty {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      @media (max-width: 760px) {
        .card-preview {
          grid-template-columns: 1fr;
        }

        .card-image {
          aspect-ratio: 4 / 5;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="site-nav">
        <div class="site-brand">Community Verse Games</div>
        <div class="site-links">

          <a href="./character-roster.html">Character Roster</a>
        </div>
      </nav>

      <section class="hero">
        <p class="eyebrow">Card Preview</p>
        <h1 id="preview-title">Staff Game Card</h1>
        <p>This page shows a quick game-card preview for a staff character. Dynamic values like current revenue lift still depend on the exact zoo state during play.</p>
      </section>

      <div id="preview-root"></div>
    </main>

      function slugifyCharacterName(name) {
        return name
          .toLowerCase()
          .replace(/["'`.]/g, '')
          .replace(/&/g, ' and ')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '')
          .replace(/-+/g, '-');
      }

      function currency(value) {
        return `$${value.toLocaleString()}`;
      }

      function getRequestedCard() {
        const params = new URLSearchParams(window.location.search);
        const requested = params.get('card');
        return staffCards.find((card) => card.id === requested || slugifyCharacterName(card.name) === requested);
      }

      function fillImage(container, card) {
        const slug = slugifyCharacterName(card.name);
        const img = new Image();
        img.alt = card.name;
        img.onload = () => {
          container.classList.remove('placeholder');
          container.textContent = '';
          container.appendChild(img);
        };
        img.onerror = () => {
          if (img.src.endsWith('.jpg')) {
            img.src = `./assets/characters/staff/${slug}.png`;
          }
        };
        img.src = `./assets/characters/staff/${slug}.jpg`;
      }

      function renderPreview() {
        const root = document.getElementById('preview-root');
        const card = getRequestedCard();
        if (!card) {
          root.innerHTML = `
            <section class="empty">
              <h2>Card not found</h2>
              <p>This staff preview link does not match any current character card.</p>
            </section>
          `;
          return;
        }

        document.getElementById('preview-title').textContent = `${card.name} Card Preview`;
        root.innerHTML = `
          <section class="card-preview">
            <div class="card-image placeholder">No image added yet</div>
            <div class="card-body">
              <h2>${card.name}</h2>
              <p>${card.description}</p>
              <div class="stat-pills">
                <span class="pill">Visitors +${card.visitors.toLocaleString()}</span>
                <span class="pill">Salary ${currency(card.salary)}</span>
              </div>
              <div class="detail"><strong>Revenue Role:</strong> ${card.revenueRole}</div>
              <div class="detail"><strong>Preview Note:</strong> Value If Added and Profit Point depend on your current zoo, so those are only shown inside an active game.</div>
              <div class="tag-pills">
                ${card.tags.map((tag) => `<span class="pill">${tag}</span>`).join('')}
              </div>
            </div>
          </section>
        `;
        fillImage(root.querySelector('.card-image'), card);
      }

      try {
        renderPreview();
      } catch (error) {
        const root = document.getElementById('preview-root');
        root.innerHTML = `
          <section class="empty">
            <h2>Preview unavailable</h2>
            <p>The staff card preview hit a script error. Reload the page after uploading the newest preview file.</p>
          </section>
        `;
        console.error(error);
      }

  </body>
</html>
